# Production override: use the custom OIDC-patched images from your fork's
# GHCR for the three services you actually changed. Everything else stays on
# the official makeplane/* registry images via the base compose file.
#
# Usage from this directory:
#   APP_RELEASE=stable docker compose up -d
# (`docker compose` automatically merges this override with docker-compose.yml.)
#
# Update OWNER below to your GitHub owner slug (lowercase), and choose a tag:
#   :latest          — newest build from your patch branch
#   :oidc-on-master  — same, just by branch name
#   :<short-sha>     — pinned to a specific build (recommended for prod)

x-image-owner: &owner ghcr.io/walzen-group

services:
  api:
    image: ghcr.io/walzen-group/plane-backend:latest

  worker:
    image: ghcr.io/walzen-group/plane-backend:latest

  beat-worker:
    image: ghcr.io/walzen-group/plane-backend:latest

  migrator:
    image: ghcr.io/walzen-group/plane-backend:latest

  web:
    image: ghcr.io/walzen-group/plane-frontend:latest

  admin:
    image: ghcr.io/walzen-group/plane-admin:latest
