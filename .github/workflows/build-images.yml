name: Build & publish custom images to GHCR

# Builds the three images that contain your OIDC patch:
#   plane-backend  (api + worker + beat-worker + migrator)
#   plane-frontend (web)
#   plane-admin
# Live, space, proxy stay on the official makeplane/* registry images.
#
# Pushes to ghcr.io/<owner>/plane-<image>:{latest, <branch>, <short-sha>}.
# Uses the workflow's GITHUB_TOKEN — no Docker Hub account needed.

on:
  push:
    branches: [oidc-on-master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
          - name: frontend
            context: .
            dockerfile: ./apps/web/Dockerfile.web
          - name: admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercased owner + short SHA
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BRANCH=${GITHUB_REF##*/}
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          IMAGE="ghcr.io/${OWNER_LC}/plane-${{ matrix.name }}"
          {
            echo "image=${IMAGE}"
            echo "tags=${IMAGE}:latest,${IMAGE}:${BRANCH},${IMAGE}:${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
