# Production docker-compose for self-hosted Plane (walzen-group fork).
#
# Quickstart on the prod host:
#   1. Copy this file + .env.prod.example next to each other:
#        scp docker-compose.prod.yml .env.prod.example user@host:/srv/plane/
#   2. ssh in, then:
#        cd /srv/plane
#        cp .env.prod.example .env
#        # edit .env: APP_DOMAIN, SECRET_KEY, POSTGRES_PASSWORD, RABBITMQ_PASSWORD,
#        # AWS_ACCESS_KEY_ID/SECRET, LIVE_SERVER_SECRET_KEY, CERT_EMAIL, OIDC_*
#   3. docker compose -f docker-compose.prod.yml pull
#      docker compose -f docker-compose.prod.yml up -d
#      docker compose -f docker-compose.prod.yml logs -f migrator   # wait for it to finish
#
# Image strategy:
#   * api / worker / beat-worker / migrator / web / admin → ghcr.io/walzen-group/plane-*
#     (your fork's OIDC patch; built by .github/workflows/build-images.yml)
#   * live / space / proxy → makeplane/plane-*:${APP_RELEASE:-stable} (unchanged upstream)
#   * postgres / valkey / rabbitmq / minio → official upstream images
#
# State lives under ./data/ (bind mounts). Back this directory up.

x-db-env: &db-env
  PGHOST: ${PGHOST:-plane-db}
  PGDATABASE: ${PGDATABASE:-plane}
  POSTGRES_USER: ${POSTGRES_USER:-plane}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  PGDATA: ${PGDATA:-/var/lib/postgresql/data}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-mq-env: &mq-env
  RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required, e.g. plane.example.com}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  CERT_EMAIL: ${CERT_EMAIL:-}
  CERT_ACME_CA: ${CERT_ACME_CA:-}
  CERT_ACME_DNS: ${CERT_ACME_DNS:-}
  LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
  LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  SITE_ADDRESS: ${SITE_ADDRESS:-${APP_DOMAIN}}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?LIVE_SERVER_SECRET_KEY is required}

x-oidc-env: &oidc-env
  # Optional: seed OIDC config from env on first boot. After first boot the
  # DB row wins, so further changes must go through God-mode → Authentication.
  OIDC_URL: ${OIDC_URL:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  IS_OIDC_ENABLED: ${IS_OIDC_ENABLED:-0}
  ENABLE_OIDC_SYNC: ${ENABLE_OIDC_SYNC:-0}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-https://${APP_DOMAIN}}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${APP_DOMAIN}}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  USE_MINIO: ${USE_MINIO:-1}
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD}@plane-db/${POSTGRES_DB:-plane}}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required, generate a long random string}
  AMQP_URL: ${AMQP_URL:-amqp://${RABBITMQ_USER:-plane}:${RABBITMQ_PASSWORD}@plane-mq:5672/${RABBITMQ_VHOST:-plane}}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}

services:
  # ---- backend image (your GHCR fork) ----
  api:
    image: ghcr.io/walzen-group/plane-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env, *oidc-env]
    volumes:
      - ./data/logs/api:/code/plane/logs
    depends_on:
      migrator:
        condition: service_completed_successfully
      plane-db:
        condition: service_started
      plane-redis:
        condition: service_started
      plane-mq:
        condition: service_started

  worker:
    image: ghcr.io/walzen-group/plane-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env, *oidc-env]
    volumes:
      - ./data/logs/worker:/code/plane/logs
    depends_on:
      api:
        condition: service_started

  beat-worker:
    image: ghcr.io/walzen-group/plane-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env, *oidc-env]
    volumes:
      - ./data/logs/beat:/code/plane/logs
    depends_on:
      api:
        condition: service_started

  migrator:
    image: ghcr.io/walzen-group/plane-backend:${IMAGE_TAG:-latest}
    restart: on-failure
    command: ./bin/docker-entrypoint-migrator.sh
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env, *oidc-env]
    volumes:
      - ./data/logs/migrator:/code/plane/logs
    depends_on:
      plane-db:
        condition: service_started

  # ---- frontends (web + admin are your GHCR fork; space is upstream) ----
  web:
    image: ghcr.io/walzen-group/plane-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api

  admin:
    image: ghcr.io/walzen-group/plane-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
      - web

  space:
    image: makeplane/plane-space:${APP_RELEASE:-stable}
    restart: unless-stopped
    depends_on:
      - api
      - web

  live:
    image: makeplane/plane-live:${APP_RELEASE:-stable}
    restart: unless-stopped
    environment:
      <<: [*live-env, *redis-env]
    depends_on:
      - api
      - web

  # ---- infrastructure ----
  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    command: postgres -c 'max_connections=1000'
    environment:
      <<: *db-env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
      - ./data/redis:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      <<: *mq-env
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq

  plane-minio:
    # Comment out if you're using an external S3 (set AWS_S3_ENDPOINT_URL accordingly).
    image: minio/minio:latest
    restart: unless-stopped
    command: server /export --console-address ":9090"
    environment:
      <<: *minio-env
    volumes:
      - ./data/minio:/export

  # ---- reverse proxy with auto-SSL ----
  proxy:
    # Comment out if you front Plane with your own reverse proxy (nginx, traefik,
    # caddy, cloudflare). Then expose `web`/`admin`/`space`/`api`/`live` directly.
    image: makeplane/plane-proxy:${APP_RELEASE:-stable}
    restart: unless-stopped
    environment:
      <<: *proxy-env
    ports:
      - "${LISTEN_HTTP_PORT:-80}:80"
      - "${LISTEN_HTTPS_PORT:-443}:443"
    volumes:
      - ./data/proxy/config:/config
      - ./data/proxy/data:/data
    depends_on:
      - web
      - api
      - space
      - admin
      - live
